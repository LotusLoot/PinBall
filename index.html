<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>튕겨라, 용사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 9:16 게임 판 하나가 화면 가운데에 있고, 메뉴 화면은 그 위에 겹쳐 뜬다. 게임 세계에 맞춰 밤빛 단일 테마. */
:root {
  --night: #100c20; --plum: #1d1638; --panel: #261e48; --panel2: #31275a;
  --line: rgba(255, 214, 140, 0.28); --gold: #ffc94a; --cream: #fff4dc; --muted: rgba(255, 244, 220, 0.66);
  --coral: #ff6b5b; --mint: #5be3a8; --sky: #62b6ff; --violet: #c08cff;
  --f-display: 'Jua', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--night); }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; background: radial-gradient(120% 80% at 50% 0%, #1f1840 0%, var(--night) 70%); color: var(--cream);
  font-family: var(--f-body); display: grid; place-items: center; overflow: hidden;
  word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
#game {
  --u: 0.7px; position: relative; aspect-ratio: 9 / 16; height: min(100%, calc((100vw - 32px) * 16 / 9)); max-width: 100%;
  border-radius: calc(var(--u) * 22); overflow: hidden; background: var(--night);
  box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, 0.55); touch-action: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; font-size: calc(var(--u) * 19); line-height: 1.45; touch-action: pan-y; scrollbar-width: thin; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
img { max-width: 100%; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: calc(var(--u) * 34); }
h3 { font-size: calc(var(--u) * 22); color: var(--gold); margin-top: calc(var(--u) * 18); letter-spacing: 0.02em; }
small { display: block; font-size: 0.78em; color: var(--muted); }
.ph { display: inline-block; background: var(--panel2); border-radius: 50%; }

/* 배경 */
.bg-title { background: linear-gradient(180deg, rgba(16, 12, 32, 0.25), rgba(16, 12, 32, 0.92) 62%), var(--title-bg, none) center top / cover; }
.bg-plain { background: radial-gradient(90% 60% at 50% 0%, #2b2156 0%, var(--plum) 55%, var(--night) 100%); }
.bg-map { background: radial-gradient(100% 70% at 50% 100%, #24325a 0%, var(--plum) 60%, var(--night) 100%); }
.bg-map.act1 { background: radial-gradient(100% 70% at 50% 100%, #1f3b35 0%, #17222a 60%, var(--night) 100%); }
.bg-map.act3 { background: radial-gradient(100% 70% at 50% 100%, #3a1d44 0%, #20132c 60%, var(--night) 100%); }

/* 버튼 */
.btn {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: var(--f-display); font-size: calc(var(--u) * 22); padding: calc(var(--u) * 12) calc(var(--u) * 22);
  border-radius: calc(var(--u) * 16); background: var(--panel2); color: var(--cream); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.06);
  transition: transform 0.08s ease, filter 0.15s ease;
}
.btn:active:not(:disabled) { transform: translateY(2px) scale(0.98); }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn.primary { background: linear-gradient(180deg, #ffd56a, #f0a92a); color: #3a2200; box-shadow: inset 0 -4px 0 #b9771c, 0 6px 18px rgba(255, 180, 60, 0.25); }
.btn.primary small { color: rgba(58, 34, 0, 0.7); }
.btn.danger { background: #5a2131; color: #ffd6d6; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn.small { font-size: calc(var(--u) * 18); padding: calc(var(--u) * 8) calc(var(--u) * 14); border-radius: calc(var(--u) * 12); flex-direction: row; gap: calc(var(--u) * 6); }
.btn.big { width: 100%; font-size: calc(var(--u) * 26); padding: calc(var(--u) * 16); margin-top: calc(var(--u) * 20); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btnrow { display: flex; gap: calc(var(--u) * 10); justify-content: center; flex-wrap: wrap; margin-top: calc(var(--u) * 14); }
i.coin, .gold i, .goldline i { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 2px #b9771c; vertical-align: -0.05em; margin-right: 0.3em; }
.essence i, i.ess { display: inline-block; width: 0.75em; height: 0.75em; transform: rotate(45deg); background: linear-gradient(135deg, #e6d1ff, var(--violet)); border-radius: 2px; margin-right: 0.4em; vertical-align: 0.02em; }

/* 타이틀 */
.title { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: calc(var(--u) * 70) calc(var(--u) * 34) calc(var(--u) * 30); gap: calc(var(--u) * 16); }
.logo-wrap { width: 92%; animation: float 3.4s ease-in-out infinite; }
.logo { width: 100%; filter: drop-shadow(0 calc(var(--u) * 10) calc(var(--u) * 20) rgba(0, 0, 0, 0.5)); }
.tag { text-align: center; color: var(--cream); font-size: calc(var(--u) * 19); margin: 0; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); }
.menu { margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: calc(var(--u) * 12); }
.menu .btn:not(.small) { width: 100%; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * 8); }
.row4 .btn { width: 100%; }
.essence { font-family: var(--f-display); color: #e6d1ff; font-size: calc(var(--u) * 20); }
.essence.big { font-size: calc(var(--u) * 28); text-align: center; margin: calc(var(--u) * 16) 0; }
@keyframes float { 50% { transform: translateY(calc(var(--u) * -8)) rotate(-1deg); } }

/* 페이지 */
.page { padding: calc(var(--u) * 20) calc(var(--u) * 22) calc(var(--u) * 30); }
.page.center { display: flex; flex-direction: column; align-items: center; text-align: center; min-height: calc(100% - var(--u) * 120); justify-content: center; }
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: calc(var(--u) * 12); }
.top > :last-child { justify-self: end; }
.count { color: var(--muted); font-family: var(--f-display); }
.sub { color: var(--muted); margin: calc(var(--u) * 6) 0 0; }
.result { font-size: calc(var(--u) * 24); margin: calc(var(--u) * 20) 0; }
.warn { color: #ffb4a8; font-size: calc(var(--u) * 16); margin: calc(var(--u) * 8) 0 0; }
.mt { margin-top: calc(var(--u) * 8); }
.tag.ok { font-family: var(--f-display); color: var(--mint); padding: calc(var(--u) * 6); }

/* 상단 정보 (지도, 보상 등) */
.hdr { display: flex; align-items: center; gap: calc(var(--u) * 12); padding: calc(var(--u) * 12) calc(var(--u) * 16) calc(var(--u) * 6); position: sticky; top: 0; z-index: 2; background: linear-gradient(180deg, rgba(16, 12, 32, 0.96), rgba(16, 12, 32, 0.75)); font-family: var(--f-display); }
.hp { position: relative; width: calc(var(--u) * 170); height: calc(var(--u) * 22); background: #2a2147; border-radius: 99px; overflow: hidden; }
.hpfill { position: absolute; inset: 0 auto 0 0; background: var(--mint); border-radius: 99px; }
.hpfill.low { background: var(--coral); }
.hp span { position: relative; display: block; text-align: center; font-size: calc(var(--u) * 16); line-height: calc(var(--u) * 22); text-shadow: 0 1px 2px #000; }
.gold { color: #ffd56a; font-size: calc(var(--u) * 20); }
.where { margin-left: auto; color: var(--muted); font-size: calc(var(--u) * 17); }
.iconbtn { width: calc(var(--u) * 38); height: calc(var(--u) * 34); border-radius: calc(var(--u) * 10); background: rgba(255, 244, 220, 0.12); display: grid; place-content: center; gap: calc(var(--u) * 4); }
.iconbtn span { display: block; width: calc(var(--u) * 18); height: calc(var(--u) * 3); background: var(--cream); border-radius: 2px; }
.relics { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 4); padding: 0 calc(var(--u) * 16) calc(var(--u) * 8); align-items: center; position: sticky; top: calc(var(--u) * 52); z-index: 2; background: rgba(16, 12, 32, 0.75); }
.relic { width: calc(var(--u) * 30); height: calc(var(--u) * 30); }
.relic img { width: 100%; height: 100%; object-fit: contain; }
.bagbtn { margin-left: auto; font-family: var(--f-display); font-size: calc(var(--u) * 16); padding: calc(var(--u) * 4) calc(var(--u) * 12); border-radius: calc(var(--u) * 10); background: var(--panel); box-shadow: 0 0 0 1px var(--line); }

/* 지도 */
.maparea { position: relative; height: calc(var(--u) * 770); margin: 0 calc(var(--u) * 10); }
.maparea.withrace { height: calc(var(--u) * 640); }
.mapttl { position: absolute; top: calc(var(--u) * 6); left: 0; right: 0; text-align: center; font-family: var(--f-display); color: var(--muted); font-size: calc(var(--u) * 18); }
.maplines { position: absolute; inset: 0; width: 100%; height: 100%; }
.maplines line { stroke: rgba(255, 244, 220, 0.18); stroke-width: 2.5; stroke-dasharray: 4 5; vector-effect: non-scaling-stroke; }
.maplines line.on { stroke: rgba(255, 201, 74, 0.8); stroke-dasharray: none; }
.node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 0; font-family: var(--f-display); font-size: calc(var(--u) * 14); color: var(--muted); pointer-events: none; }
.node .nimg { width: calc(var(--u) * 58); height: calc(var(--u) * 58); object-fit: contain; filter: saturate(0.4) brightness(0.65); transition: transform 0.15s; }
.node .nimg.boss { width: calc(var(--u) * 96); height: calc(var(--u) * 96); }
.node.past .nimg { filter: grayscale(1) brightness(0.45); }
.node.cur .nimg { filter: none; transform: scale(1.05); }
.node.cur span { color: var(--gold); }
.node.reach { pointer-events: auto; color: var(--cream); }
.node.reach .nimg { filter: drop-shadow(0 0 calc(var(--u) * 10) rgba(255, 201, 74, 0.9)); animation: pulse 1.1s ease-in-out infinite; }
.node.reach:hover .nimg { transform: scale(1.12); }
.node.boss.reach .nimg, .node.boss .nimg { filter: none; }
.node.boss:not(.reach) .nimg { filter: brightness(0.5); }
.hint { text-align: center; color: var(--muted); font-size: calc(var(--u) * 16); margin: 0; }
@keyframes pulse { 50% { transform: scale(1.1); } }

/* 카드 */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 10); margin-top: calc(var(--u) * 10); }
.cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.one { grid-template-columns: minmax(0, calc(var(--u) * 260)); justify-content: center; }
.card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--u) * 4); padding: calc(var(--u) * 12) calc(var(--u) * 8); background: var(--panel); border-radius: calc(var(--u) * 16); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.06); min-width: 0; }
.card .cimg { width: calc(var(--u) * 70); height: calc(var(--u) * 70); object-fit: contain; }
.card .cname { font-family: var(--f-display); font-size: calc(var(--u) * 20); line-height: 1.2; }
.card .crar { font-size: calc(var(--u) * 14); }
.card .cdesc { font-size: calc(var(--u) * 15); color: var(--muted); flex: 1; overflow-wrap: anywhere; }
.card .btn, .card .tag { margin-top: calc(var(--u) * 6); }
.card.rar-uncommon { box-shadow: inset 0 0 0 2px rgba(98, 182, 255, 0.55); }
.card.rar-rare { box-shadow: inset 0 0 0 2px rgba(255, 201, 74, 0.8), 0 0 calc(var(--u) * 24) rgba(255, 201, 74, 0.35); }
.card.dim { opacity: 0.45; }
.card.solo { padding: calc(var(--u) * 18); }
.card.solo .cimg { width: calc(var(--u) * 110); height: calc(var(--u) * 110); }
.card.mon .cimg { width: calc(var(--u) * 150); height: calc(var(--u) * 150); }
.lv { color: var(--gold); }
.pop { animation: popin 0.4s cubic-bezier(.2, 1.5, .4, 1) both; }
.cards .pop:nth-child(2) { animation-delay: 0.08s; } .cards .pop:nth-child(3) { animation-delay: 0.16s; }
.pop.rar-rare { animation: popin 0.4s cubic-bezier(.2, 1.5, .4, 1) both, wiggle 0.5s 0.4s 2; }
@keyframes popin { from { transform: scale(0.6) translateY(calc(var(--u) * 20)); opacity: 0; } }
@keyframes wiggle { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
.glow-rare { box-shadow: inset 0 0 0 2px var(--gold), 0 0 calc(var(--u) * 50) rgba(255, 201, 74, 0.6); }
.glow-uncommon { box-shadow: inset 0 0 0 2px var(--sky), 0 0 calc(var(--u) * 40) rgba(98, 182, 255, 0.5); }

/* 보상, 상점, 휴식, 이벤트 */
.reward .win { text-align: center; color: var(--gold); font-size: calc(var(--u) * 44); }
.goldline { text-align: center; font-family: var(--f-display); font-size: calc(var(--u) * 22); color: #ffd56a; }
.goldline small { display: inline; }
.service { display: flex; align-items: center; gap: calc(var(--u) * 10); background: var(--panel); border-radius: calc(var(--u) * 16); padding: calc(var(--u) * 12) calc(var(--u) * 16); margin-top: calc(var(--u) * 16); }
.service > div { flex: 1; min-width: 0; }
.bigicon { width: calc(var(--u) * 120); height: calc(var(--u) * 120); object-fit: contain; display: block; margin: calc(var(--u) * 10) auto; }
.rest, .event { text-align: center; }
.evimg { width: calc(var(--u) * 150); height: calc(var(--u) * 150); object-fit: contain; display: block; margin: calc(var(--u) * 10) auto; }
.choices { display: flex; flex-direction: column; gap: calc(var(--u) * 10); margin-top: calc(var(--u) * 20); }
.choice { text-align: left; background: var(--panel); border-radius: calc(var(--u) * 16); padding: calc(var(--u) * 14) calc(var(--u) * 18); box-shadow: inset 0 0 0 1px var(--line); transition: background 0.15s; }
.choice b { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 22); display: block; }
.choice:hover:not(:disabled) { background: var(--panel2); }
.choice:disabled { opacity: 0.4; cursor: default; }
.chest { display: inline-block; }
.shake-uncommon { animation: wiggle 0.3s infinite; }
.shake-rare { animation: wiggle 0.15s infinite; filter: drop-shadow(0 0 calc(var(--u) * 20) var(--gold)); }
.actintro { position: relative; }
.actbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; }
.actbox { position: relative; background: rgba(16, 12, 32, 0.78); padding: calc(var(--u) * 28); border-radius: calc(var(--u) * 22); width: 90%; }
.actbox h1 { font-size: calc(var(--u) * 54); color: var(--gold); }
.actbox small { font-family: var(--f-display); font-size: calc(var(--u) * 22); }

/* 캐릭터 선택 */
.heroes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--u) * 10); }
.hero { background: var(--panel); border-radius: calc(var(--u) * 18); padding: calc(var(--u) * 10); display: flex; flex-direction: column; align-items: center; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.05); }
.hero.sel { box-shadow: inset 0 0 0 3px var(--gold), 0 0 calc(var(--u) * 20) rgba(255, 201, 74, 0.3); }
.himg { height: calc(var(--u) * 150); object-fit: contain; }
.hero.locked .himg { filter: brightness(0) opacity(0.6); }
.hname { font-family: var(--f-display); font-size: calc(var(--u) * 22); }
.hsub { font-size: calc(var(--u) * 15); color: var(--muted); text-align: center; }
.detail { background: rgba(255, 255, 255, 0.04); border-radius: calc(var(--u) * 16); padding: calc(var(--u) * 14) calc(var(--u) * 18); margin-top: calc(var(--u) * 12); }
.detail p { margin: calc(var(--u) * 4) 0; color: var(--muted); }
.dname { font-family: var(--f-display); font-size: calc(var(--u) * 26); color: var(--gold); }
.startbag { display: flex; align-items: center; gap: calc(var(--u) * 6); flex-wrap: wrap; font-size: calc(var(--u) * 16); color: var(--muted); }
.mini { width: calc(var(--u) * 30); height: calc(var(--u) * 30); }
.asc { display: flex; align-items: center; gap: calc(var(--u) * 12); margin-top: calc(var(--u) * 10); }
.asc > div { flex: 1; min-width: 0; }
.asc b { font-family: var(--f-display); font-weight: 400; color: var(--violet); font-size: calc(var(--u) * 20); }

/* 결과 */
.results h1 { font-size: calc(var(--u) * 40); margin-top: calc(var(--u) * 8); }
.results h1.win { color: var(--gold); } .results h1.lose { color: #ffb4a8; }
.resimg { height: calc(var(--u) * 160); }
.resimg.down { transform: rotate(-80deg) translateX(calc(var(--u) * -40)); filter: grayscale(0.6); }
.stats { border-collapse: collapse; margin: calc(var(--u) * 16) auto 0; font-size: calc(var(--u) * 19); }
.stats th { text-align: left; font-weight: 400; color: var(--muted); padding: calc(var(--u) * 4) calc(var(--u) * 24) calc(var(--u) * 4) 0; }
.stats td { text-align: right; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.codebox { background: var(--panel); border-radius: calc(var(--u) * 16); padding: calc(var(--u) * 14); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 8); margin-top: calc(var(--u) * 10); width: 100%; }
.codebox code { font-size: calc(var(--u) * 20); letter-spacing: 0.04em; color: var(--gold); user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }

/* 해금, 도감, 업적 */
.urow { display: flex; align-items: center; gap: calc(var(--u) * 12); padding: calc(var(--u) * 10) calc(var(--u) * 12); background: var(--panel); border-radius: calc(var(--u) * 14); margin-top: calc(var(--u) * 8); }
.urow.owned { opacity: 0.6; }
.uimg { width: calc(var(--u) * 48); height: calc(var(--u) * 48); object-fit: contain; flex: none; }
.uimg.perma { background: radial-gradient(circle, #e6d1ff 0 30%, transparent 32%), var(--panel2); border-radius: 50%; }
.utext { flex: 1; min-width: 0; }
.utext b { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 20); }
.tabs { display: flex; gap: calc(var(--u) * 6); margin-bottom: calc(var(--u) * 12); }
.tab { flex: 1; font-family: var(--f-display); font-size: calc(var(--u) * 20); padding: calc(var(--u) * 8); border-radius: calc(var(--u) * 12); background: var(--panel); color: var(--muted); }
.tab.on { background: var(--panel2); color: var(--gold); box-shadow: inset 0 -3px 0 var(--gold); }
.codex { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--u) * 8); }
.cx { background: var(--panel); border-radius: calc(var(--u) * 14); padding: calc(var(--u) * 8) calc(var(--u) * 4); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 4); font-size: calc(var(--u) * 14); min-width: 0; }
.cx img, .cx .ph { width: calc(var(--u) * 64); height: calc(var(--u) * 64); object-fit: contain; }
.cx span { overflow-wrap: anywhere; text-align: center; line-height: 1.2; }
.cx.unseen img { filter: brightness(0) opacity(0.45); }
.cx.unseen span { color: var(--muted); }
.achs { display: flex; flex-direction: column; gap: calc(var(--u) * 8); }
.ach { display: flex; align-items: center; gap: calc(var(--u) * 12); background: var(--panel); border-radius: calc(var(--u) * 14); padding: calc(var(--u) * 12); opacity: 0.55; }
.ach.done { opacity: 1; box-shadow: inset 0 0 0 2px rgba(255, 201, 74, 0.5); }
.ach b { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 20); }
.medal { width: calc(var(--u) * 36); height: calc(var(--u) * 36); border-radius: 50%; background: var(--panel2); flex: none; }
.ach.done .medal { background: radial-gradient(circle at 35% 35%, #fff2b8, var(--gold) 50%, #b9771c); }

/* 모달 */
#modal { position: absolute; inset: 0; background: rgba(8, 6, 18, 0.62); display: grid; place-items: center; z-index: 20; padding: calc(var(--u) * 20); animation: fade 0.15s; }

<script>

  var i = 0, dir = null;
  function add(src, ok, bad) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.body.appendChild(s); }
  function next() {
    if (i >= list.length) return;
    var n = list[i++];
